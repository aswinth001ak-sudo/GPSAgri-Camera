<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>GPSAgri Agriculture Vehicle</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #061008;
    color: white;

    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    height: 52px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #102515;

    border-bottom: 1px solid #2d6b39;
}

.logo {
    font-size: 19px;
    font-weight: bold;
}

.subtitle {
    font-size: 10px;
    color: #8eb996;
    margin-top: 2px;
}

.connection {

    display: flex;
    align-items: center;

    gap: 6px;

    font-size: 11px;
}

.connectionDot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ff3333;

    box-shadow: 0 0 7px #ff3333;
}

.connectionDot.connected {

    background: #22dd55;

    box-shadow: 0 0 7px #22dd55;
}


/* =====================================================
   MAIN
===================================================== */

.main {

    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;
}


/* =====================================================
   CAMERA
===================================================== */

.cameraArea {

    position: relative;

    flex: 1;

    min-height: 0;

    background: black;

    overflow: hidden;
}

#remoteVideo {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: black;
}

#pathCanvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    touch-action: none;
}


/* =====================================================
   CAMERA STATUS
===================================================== */

.cameraTop {

    position: absolute;

    top: 8px;
    left: 8px;
    right: 8px;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.statusBadge {

    padding: 6px 9px;

    border-radius: 7px;

    background: rgba(0,0,0,0.68);

    font-size: 11px;

    font-weight: bold;
}

#modeBadge {
    color: #ff4444;
}

#cameraBadge {
    color: #ffcc00;
}

.cameraBottom {

    position: absolute;

    bottom: 8px;
    left: 8px;
    right: 8px;

    display: flex;

    gap: 6px;

    justify-content: center;

    pointer-events: none;
}

.cameraInfo {

    padding: 5px 8px;

    border-radius: 6px;

    background: rgba(0,0,0,0.68);

    font-size: 10px;
}


/* =====================================================
   CONTROL AREA
===================================================== */

.controls {

    width: 100%;

    background: #0c1b10;

    border-top: 1px solid #285b31;

    overflow-y: auto;

    padding: 7px;
}


/* =====================================================
   CONNECTION
===================================================== */

.connectionRow {

    display: grid;

    grid-template-columns: 1fr 95px;

    gap: 5px;

    margin-bottom: 5px;
}

#cameraPeerId {

    width: 100%;

    min-width: 0;

    padding: 9px;

    border-radius: 7px;

    border: 1px solid #416b49;

    background: #071009;

    color: white;

    outline: none;

    font-size: 12px;
}

.smallButton {

    border: none;

    border-radius: 7px;

    color: white;

    font-size: 11px;

    font-weight: bold;

    background: #17652a;
}

#connectionText {

    text-align: center;

    color: #a5bca9;

    font-size: 10px;

    margin-bottom: 5px;
}


/* =====================================================
   STATUS GRID
===================================================== */

.statusGrid {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 4px;

    margin-bottom: 7px;
}

.statusItem {

    background: #071009;

    border: 1px solid #244c2b;

    border-radius: 6px;

    padding: 5px 2px;

    text-align: center;
}

.statusLabel {

    display: block;

    font-size: 8px;

    color: #7e9a84;
}

.statusValue {

    display: block;

    margin-top: 2px;

    font-size: 11px;

    font-weight: bold;

    color: #6ee57a;
}


/* =====================================================
   MANUAL
===================================================== */

.manual {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    grid-template-rows: repeat(3, 42px);

    gap: 4px;

    max-width: 330px;

    margin: 0 auto 7px;
}

.controlButton {

    border: none;

    border-radius: 8px;

    color: white;

    font-size: 12px;

    font-weight: bold;

    box-shadow: inset 0 -2px rgba(0,0,0,0.2);
}

.controlButton:active {
    transform: scale(0.95);
}

.forward {

    grid-column: 2;
    grid-row: 1;

    background: #168b3b;
}

.left {

    grid-column: 1;
    grid-row: 2;

    background: #1976d2;
}

.stop {

    grid-column: 2;
    grid-row: 2;

    background: #d52222;

    font-size: 14px;
}

.right {

    grid-column: 3;
    grid-row: 2;

    background: #1976d2;
}

.backward {

    grid-column: 2;
    grid-row: 3;

    background: #e67e22;
}


/* =====================================================
   SETTINGS
===================================================== */

.setting {
    margin-bottom: 6px;
}

.settingHeader {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 10px;

    margin-bottom: 2px;

    color: #b4c6b7;
}

.settingValue {

    color: #6ee57a;

    font-weight: bold;
}

input[type="range"] {

    width: 100%;

    height: 25px;

    margin: 0;

    accent-color: #36c956;
}


/* =====================================================
   PATH ACTIONS
===================================================== */

.actionRow {

    display: grid;

    grid-template-columns: 1fr 1fr 1fr;

    gap: 4px;

    margin-bottom: 6px;
}

.action {

    border: none;

    border-radius: 7px;

    padding: 9px 3px;

    color: white;

    font-size: 10px;

    font-weight: bold;
}

.draw {
    background: #8e44ad;
}

.clear {
    background: #555;
}

.auto {
    background: #188d3c;
}


/* =====================================================
   SERVO
===================================================== */

.servoTitle {

    font-size: 10px;

    color: #9eb6a2;

    margin-bottom: 4px;
}

.servoRow {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 4px;
}

.servoButton {

    border: none;

    border-radius: 7px;

    padding: 9px 2px;

    color: white;

    font-size: 10px;

    font-weight: bold;
}

.servoUp {
    background: #1976d2;
}

.servoHold {
    background: #555;
}

.servoDown {
    background: #e67e22;
}


/* =====================================================
   EMERGENCY
===================================================== */

.emergency {

    position: fixed;

    right: 9px;
    bottom: 9px;

    z-index: 100;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: 3px solid #ffaaaa;

    background: #d00000;

    color: white;

    font-size: 9px;

    font-weight: bold;

    box-shadow:
        0 0 14px rgba(255,0,0,0.55);
}


/* =====================================================
   PORTRAIT
===================================================== */

@media (orientation: portrait) {

    .cameraArea {

        height: 48vh;

        flex: 0 0 48vh;
    }

    .controls {
        flex: 1;
    }
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) {

    .main {
        flex-direction: row;
    }

    .cameraArea {

        width: 62%;

        height: 100%;

        flex: 0 0 62%;
    }

    .controls {

        width: 38%;

        height: 100%;

        border-top: none;

        border-left: 1px solid #285b31;
    }

    .statusGrid {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .manual {

        max-width: 270px;

        grid-template-rows:
            repeat(3, 38px);
    }

    .controlButton {
        font-size: 10px;
    }

    .emergency {

        width: 52px;
        height: 52px;

        right: calc(38% + 8px);

        bottom: 8px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 900px) {

    .header {
        height: 58px;
    }

    .logo {
        font-size: 21px;
    }

    .main {
        flex-direction: row;
    }

    .cameraArea {

        width: 68%;

        height: 100%;

        flex: 0 0 68%;
    }

    .controls {

        width: 32%;

        height: 100%;

        border-top: none;

        border-left: 1px solid #285b31;

        padding: 12px;
    }

    .manual {

        max-width: 360px;

        grid-template-rows:
            repeat(3, 55px);
    }

    .controlButton {
        font-size: 14px;
    }

    .emergency {

        right: calc(32% + 15px);

        bottom: 15px;

        width: 65px;
        height: 65px;
    }
}


/* =====================================================
   SHORT LANDSCAPE
===================================================== */

@media
(orientation: landscape)
and (max-height: 450px) {

    .header {
        height: 40px;
    }

    .logo {
        font-size: 15px;
    }

    .subtitle {
        display: none;
    }

    .manual {

        grid-template-rows:
            repeat(3, 34px);
    }

    .setting {
        margin-bottom: 2px;
    }

    input[type="range"] {
        height: 20px;
    }
}

</style>

</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div>

        <div class="logo">
            🚜 GPSAgri
        </div>

        <div class="subtitle">
            Agriculture Vehicle Controller
        </div>

    </div>

    <div class="connection">

        <span
            id="connectionDot"
            class="connectionDot">
        </span>

        <span id="headerConnection">
            OFFLINE
        </span>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<!-- =====================================================
     CAMERA
===================================================== -->

<section class="cameraArea">

    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>

    <canvas
        id="pathCanvas">
    </canvas>


    <div class="cameraTop">

        <div
            id="modeBadge"
            class="statusBadge">

            STOPPED

        </div>


        <div
            id="cameraBadge"
            class="statusBadge">

            📷 CAMERA OFF

        </div>

    </div>


    <div class="cameraBottom">

        <div class="cameraInfo">

            PATH:
            <span id="pathInfo">
                NONE
            </span>

        </div>

        <div class="cameraInfo">

            STEER:
            <span id="steerInfo">
                CENTER
            </span>

        </div>

    </div>

</section>


<!-- =====================================================
     CONTROLS
===================================================== -->

<section class="controls">


<!-- CAMERA CONNECTION -->

<div class="connectionRow">

    <input
        id="cameraPeerId"
        type="text"
        placeholder="Phone 1 Camera Peer ID">

    <button
        class="smallButton"
        onclick="connectCamera()">

        📷 CONNECT

    </button>

</div>


<div id="connectionText">
    Initializing PeerJS...
</div>


<!-- STATUS -->

<div class="statusGrid">

    <div class="statusItem">

        <span class="statusLabel">
            MODE
        </span>

        <span
            id="modeStatus"
            class="statusValue">

            STOP

        </span>

    </div>


    <div class="statusItem">

        <span class="statusLabel">
            SPEED
        </span>

        <span
            id="speedStatus"
            class="statusValue">

            180

        </span>

    </div>


    <div class="statusItem">

        <span class="statusLabel">
            STEER
        </span>

        <span
            id="steerStatus"
            class="statusValue">

            CENTER

        </span>

    </div>


    <div class="statusItem">

        <span class="statusLabel">
            SERVO
        </span>

        <span
            id="servoStatus"
            class="statusValue">

            10°

        </span>

    </div>

</div>


<!-- MANUAL CONTROL -->

<div class="manual">


    <button
        class="controlButton forward"
        onpointerdown="manualDown(event,'/forward')"
        onpointerup="manualUp(event)"
        onpointercancel="manualUp(event)"
        onpointerleave="manualLeave(event)">

        ⬆️ FORWARD

    </button>


    <button
        class="controlButton left"
        onpointerdown="manualDown(event,'/left')"
        onpointerup="manualUp(event)"
        onpointercancel="manualUp(event)"
        onpointerleave="manualLeave(event)">

        ⬅️ LEFT

    </button>


    <button
        class="controlButton stop"
        onclick="manualStop()">

        ⛔ STOP

    </button>


    <button
        class="controlButton right"
        onpointerdown="manualDown(event,'/right')"
        onpointerup="manualUp(event)"
        onpointercancel="manualUp(event)"
        onpointerleave="manualLeave(event)">

        ➡️ RIGHT

    </button>


    <button
        class="controlButton backward"
        onpointerdown="manualDown(event,'/back')"
        onpointerup="manualUp(event)"
        onpointercancel="manualUp(event)"
        onpointerleave="manualLeave(event)">

        ⬇️ BACK

    </button>

</div>


<!-- SPEED -->

<div class="setting">

    <div class="settingHeader">

        <span>
            🚜 VEHICLE SPEED
        </span>

        <span
            id="speedValue"
            class="settingValue">

            180

        </span>

    </div>


    <input
        id="speedSlider"
        type="range"
        min="50"
        max="255"
        value="180"
        oninput="speedChanged(this.value)">

</div>


<!-- SENSITIVITY -->

<div class="setting">

    <div class="settingHeader">

        <span>
            🎯 STEERING SENSITIVITY
        </span>

        <span
            id="sensitivityValue"
            class="settingValue">

            60%

        </span>

    </div>


    <input
        id="sensitivitySlider"
        type="range"
        min="0"
        max="100"
        value="60"
        oninput="sensitivityChanged(this.value)">

</div>


<!-- PATH -->

<div class="actionRow">

    <button
        class="action draw"
        onclick="startDrawing()">

        ✏️ DRAW PATH

    </button>


    <button
        class="action clear"
        onclick="clearPath()">

        🗑 CLEAR

    </button>


    <button
        class="action auto"
        onclick="startAuto()">

        ▶ AUTO

    </button>

</div>


<!-- SERVO -->

<div class="servoTitle">

    ⚙️ SOIL PROBE SERVO

</div>


<div class="servoRow">

    <button
        class="servoButton servoUp"
        onclick="servoUp()">

        ⬆️ UP

    </button>


    <button
        class="servoButton servoHold"
        onclick="servoHold()">

        ⏸ HOLD

    </button>


    <button
        class="servoButton servoDown"
        onclick="servoDown()">

        ⬇️ DOWN

    </button>

</div>


<div class="setting">

    <div class="settingHeader">

        <span>
            SERVO ANGLE
        </span>

        <span
            id="servoValue"
            class="settingValue">

            10°

        </span>

    </div>


    <input
        id="servoSlider"
        type="range"
        min="0"
        max="180"
        value="10"
        oninput="servoChanged(this.value)">

</div>


</section>

</div>


<!-- EMERGENCY STOP -->

<button
    class="emergency"
    onclick="emergencyStop()">

    ⛔<br>
    EMERGENCY<br>
    STOP

</button>


</div>


<script>

/* =====================================================
   PEERJS
===================================================== */

let peer = null;

let controllerPeerId = "";

let cameraCall = null;

let cameraDataConnection = null;


/* =====================================================
   VIDEO / CANVAS
===================================================== */

const video =
    document.getElementById(
        "remoteVideo"
    );

const canvas =
    document.getElementById(
        "pathCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* =====================================================
   STATE
===================================================== */

let autoMode = false;

let drawingMode = false;

let pathStarted = false;

let pathPoints = [];

let autoTimer = null;

let manualTimer = null;

let manualActive = false;

let manualCommand = "";

let vehicleSpeed = 180;

let steeringSensitivity = 60;

let servoAngle = 10;

let lastSentX = 999;


/* =====================================================
   PEER INITIALIZATION
===================================================== */

function initializePeer() {

    setConnection(
        "Connecting to PeerJS..."
    );


    peer = new Peer();


    peer.on(
        "open",
        function(id) {

            controllerPeerId = id;

            setConnection(
                "PeerJS ready"
            );

        }
    );


    peer.on(
        "error",
        function(error) {

            console.log(
                "PeerJS error:",
                error
            );

            setConnection(
                "PeerJS error"
            );

        }
    );


    peer.on(
        "disconnected",
        function() {

            setConnection(
                "PeerJS disconnected"
            );

        }
    );


    peer.on(
        "call",
        function(call) {

            cameraCall = call;

            call.answer();


            call.on(
                "stream",
                function(stream) {

                    video.srcObject =
                        stream;


                    video.play()
                        .catch(
                            function() {}
                        );


                    document.getElementById(
                        "cameraBadge"
                    ).textContent =
                        "📷 CAMERA CONNECTED";


                    document.getElementById(
                        "connectionDot"
                    ).classList.add(
                        "connected"
                    );


                    document.getElementById(
                        "headerConnection"
                    ).textContent =
                        "CONNECTED";


                    resizeCanvas();

                }
            );


            call.on(
                "close",
                function() {

                    cameraDisconnected();

                }
            );

        }
    );

}


/* =====================================================
   CONNECTION STATUS
===================================================== */

function setConnection(text) {

    document.getElementById(
        "connectionText"
    ).textContent =
        text;

}


/* =====================================================
   CONNECT CAMERA
===================================================== */

function connectCamera() {

    if (!peer) {

        alert(
            "PeerJS is not ready."
        );

        return;

    }


    const cameraID =
        document.getElementById(
            "cameraPeerId"
        ).value.trim();


    if (!cameraID) {

        alert(
            "Enter Phone 1 Camera Peer ID."
        );

        return;

    }


    setConnection(
        "Connecting to Phone 1..."
    );


    cameraDataConnection =
        peer.connect(
            cameraID,
            {
                reliable: true
            }
        );


    cameraDataConnection.on(
        "open",
        function() {

            cameraDataConnection.send({

                type:
                    "request-video",

                controllerPeerId:
                    controllerPeerId

            });


            setConnection(
                "Camera requested..."
            );

        }
    );

}


/* =====================================================
   CAMERA DISCONNECTED
===================================================== */

function cameraDisconnected() {

    video.srcObject = null;


    document.getElementById(
        "cameraBadge"
    ).textContent =
        "📷 CAMERA OFF";


    document.getElementById(
        "connectionDot"
    ).classList.remove(
        "connected"
    );


    document.getElementById(
        "headerConnection"
    ).textContent =
        "OFFLINE";

}


/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvas() {

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;

    redrawPath();

}


window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizeCanvas,
            300
        );

    }
);


/* =====================================================
   DRAW PATH MODE
===================================================== */

function startDrawing() {

    stopAuto();

    manualStop();


    drawingMode = true;

    pathStarted = false;

    pathPoints = [];


    redrawPath();


    document.getElementById(
        "modeBadge"
    ).textContent =
        "✏️ CLICK START";


    document.getElementById(
        "modeBadge"
    ).style.color =
        "#ffcc00";


    document.getElementById(
        "modeStatus"
    ).textContent =
        "DRAW";

}


/* =====================================================
   POINTER DOWN
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        if (!drawingMode)
            return;


        event.preventDefault();


        const point =
            getCanvasPoint(event);


        /*
           FIRST CLICK:
           Start path.
        */

        if (!pathStarted) {

            pathStarted = true;

            pathPoints = [];

            pathPoints.push(
                point
            );


            document.getElementById(
                "modeBadge"
            ).textContent =
                "✏️ DRAG PATH";


            redrawPath();


            try {

                canvas.setPointerCapture(
                    event.pointerId
                );

            } catch(e) {}


            return;

        }


        /*
           SECOND CLICK:
           Finish path.
        */

        drawingMode = false;

        pathStarted = false;


        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        } catch(e) {}


        document.getElementById(
            "modeBadge"
        ).textContent =
            "PATH READY";


        document.getElementById(
            "modeBadge"
        ).style.color =
            "#00bfff";


        document.getElementById(
            "modeStatus"
        ).textContent =
            "READY";


        updatePathInfo();

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(event) {

        /*
           Only draw after the FIRST CLICK.
        */

        if (
            !drawingMode ||
            !pathStarted
        ) {

            return;

        }


        event.preventDefault();


        const point =
            getCanvasPoint(event);


        if (
            pathPoints.length === 0
        ) {

            pathPoints.push(
                point
            );

            redrawPath();

            return;

        }


        const last =
            pathPoints[
                pathPoints.length - 1
            ];


        const dx =
            point.x -
            last.x;


        const dy =
            point.y -
            last.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance >= 4
        ) {

            pathPoints.push(
                point
            );

            redrawPath();

            updatePathInfo();

        }

    }
);


/* =====================================================
   GET CANVAS POINT
===================================================== */

function getCanvasPoint(event) {

    const rect =
        canvas.getBoundingClientRect();


    let x =
        event.clientX -
        rect.left;


    let y =
        event.clientY -
        rect.top;


    x =
        Math.max(
            0,
            Math.min(
                canvas.width,
                x
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                canvas.height,
                y
            )
        );


    return {
        x: x,
        y: y
    };

}


/* =====================================================
   REDRAW
===================================================== */

function redrawPath() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        pathPoints.length === 0
    ) {

        return;

    }


    /* CENTER LINE */

    ctx.beginPath();

    ctx.setLineDash([
        8,
        7
    ]);

    ctx.strokeStyle =
        "rgba(255,255,255,0.5)";

    ctx.lineWidth = 1;


    ctx.moveTo(
        canvas.width / 2,
        0
    );


    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );


    ctx.stroke();

    ctx.setLineDash([]);


    /* PATH */

    ctx.beginPath();

    ctx.strokeStyle =
        "#00ff55";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    for (
        let i = 0;
        i < pathPoints.length;
        i++
    ) {

        const p =
            pathPoints[i];


        if (i === 0) {

            ctx.moveTo(
                p.x,
                p.y
            );

        } else {

            ctx.lineTo(
                p.x,
                p.y
            );

        }

    }


    ctx.stroke();


    /* START */

    const first =
        pathPoints[0];


    ctx.beginPath();

    ctx.fillStyle =
        "#00bfff";


    ctx.arc(
        first.x,
        first.y,
        8,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* END */

    const last =
        pathPoints[
            pathPoints.length - 1
        ];


    ctx.beginPath();

    ctx.fillStyle =
        "#ff3030";


    ctx.arc(
        last.x,
        last.y,
        9,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* =====================================================
   PATH INFO
===================================================== */

function updatePathInfo() {

    document.getElementById(
        "pathInfo"
    ).textContent =
        pathPoints.length > 0
        ? pathPoints.length + " POINTS"
        : "NONE";

}


/* =====================================================
   CLEAR PATH
===================================================== */

function clearPath() {

    stopAuto();

    pathPoints = [];

    drawingMode = false;

    pathStarted = false;

    redrawPath();

    updatePathInfo();

    sendStop();

}


/* =====================================================
   START AUTO
===================================================== */

function startAuto() {

    if (
        pathPoints.length < 2
    ) {

        alert(
            "Draw a path first."
        );

        return;

    }


    drawingMode = false;

    pathStarted = false;


    manualStop();


    autoMode = true;


    document.getElementById(
        "modeBadge"
    ).textContent =
        "▶ AUTO";


    document.getElementById(
        "modeBadge"
    ).style.color =
        "#00ff55";


    document.getElementById(
        "modeStatus"
    ).textContent =
        "AUTO";


    if (autoTimer) {

        clearInterval(
            autoTimer
        );

    }


    autoTimer =
        setInterval(
            autoUpdate,
            150
        );


    autoUpdate();

}


/* =====================================================
   STOP AUTO
===================================================== */

function stopAuto() {

    autoMode = false;


    if (autoTimer) {

        clearInterval(
            autoTimer
        );

        autoTimer = null;

    }


    sendStop();

}


/* =====================================================
   AUTO PATH
===================================================== */

function autoUpdate() {

    if (!autoMode)
        return;


    if (
        pathPoints.length < 2
    ) {

        stopAuto();

        return;

    }


    const lookY =
        canvas.height * 0.72;


    let target = null;

    let best =
        Infinity;


    for (
        let i = 0;
        i < pathPoints.length;
        i++
    ) {

        const p =
            pathPoints[i];


        const distance =
            Math.abs(
                p.y -
                lookY
            );


        if (
            distance < best
        ) {

            best =
                distance;

            target =
                p;

        }

    }


    if (!target) {

        sendStop();

        return;

    }


    const center =
        canvas.width / 2;


    let x =
        (
            target.x -
            center
        ) /
        center;


    x =
        Math.max(
            -1,
            Math.min(
                1,
                x
            )
        );


    x *=
        steeringSensitivity /
        100;


    /*
       Small deadband.
    */

    if (
        Math.abs(x) <
        0.08
    ) {

        x = 0;

    }


    if (
        x < -0.08
    ) {

        updateSteer(
            "LEFT"
        );

    }

    else if (
        x > 0.08
    ) {

        updateSteer(
            "RIGHT"
        );

    }

    else {

        updateSteer(
            "FORWARD"
        );

    }


    drawTarget(
        target
    );


    sendSteering(
        x
    );

}


/* =====================================================
   TARGET
===================================================== */

function drawTarget(point) {

    redrawPath();


    ctx.beginPath();

    ctx.strokeStyle =
        "#ffff00";

    ctx.lineWidth = 3;


    ctx.arc(
        point.x,
        point.y,
        14,
        0,
        Math.PI * 2
    );


    ctx.stroke();

}


/* =====================================================
   STEERING
===================================================== */

function sendSteering(x) {

    if (!autoMode)
        return;


    const value =
        Number(
            x.toFixed(3)
        );


    if (
        Math.abs(
            value -
            lastSentX
        ) < 0.01
    ) {

        return;

    }


    lastSentX =
        value;


    fetch(
        "/steer?x=" +
        encodeURIComponent(
            value
        ),
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "Steering:",
                error
            );

        }
    );

}


/* =====================================================
   STEERING DISPLAY
===================================================== */

function updateSteer(direction) {

    document.getElementById(
        "steerInfo"
    ).textContent =
        direction;


    document.getElementById(
        "steerStatus"
    ).textContent =
        direction;

}


/* =====================================================
   MANUAL CONTROL
===================================================== */

function manualDown(
    event,
    command
) {

    event.preventDefault();


    stopAuto();


    drawingMode = false;

    pathStarted = false;


    manualActive = true;

    manualCommand = command;


    document.getElementById(
        "modeBadge"
    ).textContent =
        "🎮 MANUAL";


    document.getElementById(
        "modeBadge"
    ).style.color =
        "#00bfff";


    document.getElementById(
        "modeStatus"
    ).textContent =
        "MANUAL";


    sendManual();


    if (manualTimer) {

        clearInterval(
            manualTimer
        );

    }


    manualTimer =
        setInterval(
            sendManual,
            300
        );

}


function sendManual() {

    if (
        !manualActive ||
        !manualCommand
    ) {

        return;

    }


    fetch(
        manualCommand,
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "Manual:",
                error
            );

        }
    );

}


function manualUp(event) {

    event.preventDefault();

    manualStop();

}


function manualLeave(event) {

    if (
        event.pointerType ===
        "mouse"
    ) {

        manualStop();

    }

}


function manualStop() {

    manualActive = false;

    manualCommand = "";


    if (manualTimer) {

        clearInterval(
            manualTimer
        );

        manualTimer = null;

    }


    sendStop();


    document.getElementById(
        "modeBadge"
    ).textContent =
        "STOPPED";


    document.getElementById(
        "modeBadge"
    ).style.color =
        "#ff4444";


    document.getElementById(
        "modeStatus"
    ).textContent =
        "STOP";


    updateSteer(
        "STOP"
    );

}


/* =====================================================
   SPEED
===================================================== */

function speedChanged(value) {

    vehicleSpeed =
        parseInt(value);


    document.getElementById(
        "speedValue"
    ).textContent =
        vehicleSpeed;


    document.getElementById(
        "speedStatus"
    ).textContent =
        vehicleSpeed;


    fetch(
        "/speed?value=" +
        vehicleSpeed,
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "Speed:",
                error
            );

        }
    );

}


/* =====================================================
   SENSITIVITY
===================================================== */

function sensitivityChanged(value) {

    steeringSensitivity =
        parseInt(value);


    document.getElementById(
        "sensitivityValue"
    ).textContent =
        steeringSensitivity +
        "%";


    fetch(
        "/sensitivity?value=" +
        steeringSensitivity,
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "Sensitivity:",
                error
            );

        }
    );

}


/* =====================================================
   SERVO
===================================================== */

function servoUp() {

    servoAngle = 10;

    updateServo();


    fetch(
        "/servo_up",
        {
            method: "GET",
            cache: "no-store"
        }
    );

}


function servoHold() {

    fetch(
        "/servo_hold",
        {
            method: "GET",
            cache: "no-store"
        }
    );

}


function servoDown() {

    servoAngle = 100;

    updateServo();


    fetch(
        "/servo_down",
        {
            method: "GET",
            cache: "no-store"
        }
    );

}


function servoChanged(value) {

    servoAngle =
        parseInt(value);


    updateServo();


    fetch(
        "/servo?angle=" +
        servoAngle,
        {
            method: "GET",
            cache: "no-store"
        }
    );

}


function updateServo() {

    document.getElementById(
        "servoValue"
    ).textContent =
        servoAngle +
        "°";


    document.getElementById(
        "servoStatus"
    ).textContent =
        servoAngle +
        "°";


    document.getElementById(
        "servoSlider"
    ).value =
        servoAngle;

}


/* =====================================================
   STOP
===================================================== */

function sendStop() {

    lastSentX = 999;


    fetch(
        "/stop",
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "STOP:",
                error
            );

        }
    );

}


/* =====================================================
   EMERGENCY STOP
===================================================== */

function emergencyStop() {

    autoMode = false;

    drawingMode = false;

    pathStarted = false;

    manualActive = false;

    manualCommand = "";


    if (autoTimer) {

        clearInterval(
            autoTimer
        );

        autoTimer = null;

    }


    if (manualTimer) {

        clearInterval(
            manualTimer
        );

        manualTimer = null;

    }


    sendStop();


    document.getElementById(
        "modeBadge"
    ).textContent =
        "⛔ EMERGENCY STOP";


    document.getElementById(
        "modeBadge"
    ).style.color =
        "#ff2222";


    document.getElementById(
        "modeStatus"
    ).textContent =
        "STOP";


    updateSteer(
        "STOP"
    );

}


/* =====================================================
   PAGE SAFETY
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (document.hidden) {

            emergencyStop();

        }

    }
);


window.addEventListener(
    "beforeunload",
    function() {

        emergencyStop();

    }
);


/* =====================================================
   START
===================================================== */

initializePeer();

updateServo();

setTimeout(
    resizeCanvas,
    500
);

</script>
