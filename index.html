<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>GPSAgri V3.2</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

body {
    margin: 0;
    padding: 0;

    background: #101010;
    color: white;

    font-family: Arial, sans-serif;

    overflow: hidden;

    touch-action: manipulation;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    height: 52px;

    background: #151515;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    border-bottom: 1px solid #333;
}

.title {

    font-size: 19px;

    font-weight: bold;
}

.status {

    font-size: 12px;

    color: #00ff66;

    font-weight: bold;
}


/* =====================================================
   VIDEO AREA
   ===================================================== */

.videoArea {

    position: relative;

    width: 100%;

    height: calc(100vh - 300px);

    min-height: 280px;

    background: black;

    overflow: hidden;
}


/* =====================================================
   REMOTE VIDEO
   ===================================================== */

#remoteVideo {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: black;
}


/* =====================================================
   PATH CANVAS
   ===================================================== */

#pathCanvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    touch-action: none;

    z-index: 2;
}


/* =====================================================
   INFORMATION CANVAS
   ===================================================== */

#infoCanvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 3;
}


/* =====================================================
   PEER CONNECTION BOX
   ===================================================== */

.peerBox {

    position: absolute;

    top: 8px;
    left: 8px;
    right: 8px;

    z-index: 10;

    background: rgba(0,0,0,0.70);

    padding: 8px;

    border-radius: 8px;
}

.peerRow {

    display: flex;

    gap: 6px;
}

.peerRow input {

    flex: 1;

    min-width: 0;

    padding: 8px;

    border-radius: 6px;

    border: none;

    outline: none;

    font-size: 13px;
}

.peerRow button {

    padding: 8px 10px;

    border: none;

    border-radius: 6px;

    background: #2196f3;

    color: white;

    font-weight: bold;
}

.myPeer {

    margin-top: 5px;

    font-size: 10px;

    color: #aaa;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =====================================================
   CONTROL PANEL
   ===================================================== */

.controlPanel {

    height: 248px;

    background: #181818;

    padding: 6px 8px;

    overflow: hidden;
}


/* =====================================================
   COMMON BUTTON
   ===================================================== */

button.control {

    border: none;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    color: white;

    min-height: 42px;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

button.control:active {

    transform: scale(0.96);

    filter: brightness(1.25);
}


/* =====================================================
   MANUAL CONTROL
   ===================================================== */

.manualTitle {

    text-align: center;

    font-size: 11px;

    color: #aaa;

    margin-bottom: 4px;
}

.manualControls {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    grid-template-rows:
        42px 42px;

    gap: 5px;

    max-width: 420px;

    margin: 0 auto 7px auto;
}


/* FORWARD */

.forward {

    grid-column: 2;

    grid-row: 1;

    background: #168a3a;
}


/* LEFT */

.left {

    grid-column: 1;

    grid-row: 2;

    background: #1976d2;
}


/* STOP */

.stop {

    grid-column: 2;

    grid-row: 2;

    background: #c62828;
}


/* RIGHT */

.right {

    grid-column: 3;

    grid-row: 2;

    background: #1976d2;
}


/* BACKWARD */

.backward {

    grid-column: 3;

    grid-row: 1;

    background: #e67e22;
}


/* =====================================================
   AUTO CONTROLS
   ===================================================== */

.autoTitle {

    text-align: center;

    font-size: 11px;

    color: #aaa;

    margin: 3px 0 4px 0;
}

.autoControls {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 5px;

    max-width: 500px;

    margin: auto;
}

.draw {

    background: #1976d2;
}

.clear {

    background: #555;
}

.start {

    background: #168a3a;
}


/* =====================================================
   DATA
   ===================================================== */

.data {

    margin-top: 7px;

    display: flex;

    justify-content: space-between;

    gap: 5px;

    font-size: 11px;

    color: #aaa;

    max-width: 600px;

    margin-left: auto;
    margin-right: auto;
}

#steerValue {

    color: #00ff66;

    font-weight: bold;
}

.mode {

    color: #ffd740;

    font-weight: bold;
}

#pathCount {

    color: #00bfff;

    font-weight: bold;
}


/* =====================================================
   SMALL SCREEN
   ===================================================== */

@media
(max-height: 650px) {

    .videoArea {

        height: calc(100vh - 270px);

    }

    .controlPanel {

        height: 218px;

    }

    .manualControls {

        grid-template-rows:
            36px 36px;

    }

    button.control {

        min-height: 36px;

        font-size: 12px;

    }

}


/* =====================================================
   LANDSCAPE
   ===================================================== */

@media
(orientation: landscape) {

    .videoArea {

        height: calc(100vh - 215px);

    }

    .controlPanel {

        height: 163px;

    }

    .manualControls {

        display: grid;

        grid-template-columns:
            repeat(5, 1fr);

        grid-template-rows: 42px;

        max-width: 650px;

    }

    .forward {

        grid-column: 1;

        grid-row: 1;

    }

    .left {

        grid-column: 2;

        grid-row: 1;

    }

    .stop {

        grid-column: 3;

        grid-row: 1;

    }

    .right {

        grid-column: 4;

        grid-row: 1;

    }

    .backward {

        grid-column: 5;

        grid-row: 1;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

    <div class="title">
        🚜 GPSAgri V3.2
    </div>

    <div
        class="status"
        id="status">

        DISCONNECTED

    </div>

</div>


<!-- =====================================================
     VIDEO
     ===================================================== -->

<div class="videoArea">


    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>


    <canvas
        id="infoCanvas">
    </canvas>


    <canvas
        id="pathCanvas">
    </canvas>


    <!-- PEER BOX -->

    <div class="peerBox">

        <div class="peerRow">

            <input
                id="cameraId"
                placeholder="Enter Phone 1 Camera Peer ID">

            <button
                onclick="connectCamera()">

                CONNECT

            </button>

        </div>


        <div class="myPeer">

            Phone 2 Peer ID:

            <span id="myPeerId">
                Creating...
            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     CONTROL PANEL
     ===================================================== -->

<div class="controlPanel">


    <!-- ================================
         MANUAL
         ================================ -->

    <div class="manualTitle">
        🕹️ MANUAL CONTROL
    </div>


    <div class="manualControls">


        <!-- FORWARD -->

        <button
            class="control forward"
            onpointerdown="manualCommand('/forward')"
            onpointerup="manualStop()"
            onpointercancel="manualStop()"
            onpointerleave="manualStop()">

            ⬆️ FORWARD

        </button>


        <!-- LEFT -->

        <button
            class="control left"
            onpointerdown="manualCommand('/left')"
            onpointerup="manualStop()"
            onpointercancel="manualStop()"
            onpointerleave="manualStop()">

            ⬅️ LEFT

        </button>


        <!-- STOP -->

        <button
            class="control stop"
            onclick="manualStop()">

            ⛔ STOP

        </button>


        <!-- RIGHT -->

        <button
            class="control right"
            onpointerdown="manualCommand('/right')"
            onpointerup="manualStop()"
            onpointercancel="manualStop()"
            onpointerleave="manualStop()">

            ➡️ RIGHT

        </button>


        <!-- BACKWARD -->

        <button
            class="control backward"
            onpointerdown="manualCommand('/back')"
            onpointerup="manualStop()"
            onpointercancel="manualStop()"
            onpointerleave="manualStop()">

            ⬇️ BACKWARD

        </button>

    </div>


    <!-- ================================
         AUTO
         ================================ -->

    <div class="autoTitle">
        🤖 PATH AUTO CONTROL
    </div>


    <div class="autoControls">


        <button
            class="control draw"
            onclick="startDrawing()">

            ✏️ DRAW PATH

        </button>


        <button
            class="control clear"
            onclick="clearPath()">

            🗑 CLEAR

        </button>


        <button
            class="control start"
            onclick="startAuto()">

            ▶ START AUTO

        </button>

    </div>


    <!-- ================================
         DATA
         ================================ -->

    <div class="data">

        <span>

            Mode:

            <span
                id="mode"
                class="mode">

                READY

            </span>

        </span>


        <span>

            Steering:

            <span id="steerValue">

                0.00

            </span>

        </span>


        <span>

            Path:

            <span id="pathCount">

                0

            </span>

        </span>

    </div>

</div>


<script>


/* =====================================================
   GPSAGRI V3.2
   PHONE 2 CONTROLLER

   MANUAL + MANUAL PATH AUTO

   PHONE 1:
   WEBRTC CAMERA

   ESP32:
   /forward
   /back
   /left
   /right
   /stop
   /steer?x=
   ===================================================== */


/* =====================================================
   PEERJS VARIABLES
   ===================================================== */

let peer = null;

let myPeerId = "";

let dataConnection = null;

let currentCall = null;


/* =====================================================
   DOM
   ===================================================== */

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const pathCanvas =
    document.getElementById(
        "pathCanvas"
    );

const infoCanvas =
    document.getElementById(
        "infoCanvas"
    );

const pathCtx =
    pathCanvas.getContext("2d");

const infoCtx =
    infoCanvas.getContext("2d");


/* =====================================================
   PATH VARIABLES
   ===================================================== */

let pathPoints = [];

let drawing = false;

let drawingEnabled = false;

let autoMode = false;

let controlTimer = null;

let lastSteer = 0;


/* =====================================================
   MANUAL VARIABLES
   ===================================================== */

let manualActive = false;


/* =====================================================
   PATH SETTINGS
   ===================================================== */

const LOOK_AHEAD_Y = 0.72;

const DEAD_BAND = 0.08;

const MAX_STEER = 1.0;


/* =====================================================
   CANVAS RESIZE
   ===================================================== */

function resizeCanvas() {

    const rect =
        pathCanvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;


    pathCanvas.width =
        rect.width * dpr;

    pathCanvas.height =
        rect.height * dpr;


    infoCanvas.width =
        rect.width * dpr;

    infoCanvas.height =
        rect.height * dpr;


    pathCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    infoCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    redraw();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* =====================================================
   PEER INITIALIZATION
   ===================================================== */

peer = new Peer();


peer.on(
    "open",
    function(id) {

        myPeerId = id;


        document.getElementById(
            "myPeerId"
        ).textContent = id;


        setStatus(
            "PEER READY",
            "#00ff66"
        );

    }
);


/* =====================================================
   DATA CONNECTION
   ===================================================== */

peer.on(
    "connection",
    function(conn) {

        dataConnection = conn;

    }
);


/* =====================================================
   VIDEO CALL
   ===================================================== */

peer.on(
    "call",
    function(call) {

        currentCall = call;


        /*
           Answer Phone 1 camera call.
        */

        call.answer();


        call.on(
            "stream",
            function(stream) {

                remoteVideo.srcObject =
                    stream;


                remoteVideo
                    .play()
                    .catch(
                        () => {}
                    );


                setStatus(
                    "LIVE CAMERA",
                    "#00ff66"
                );


                drawOverlay();

            }
        );


        call.on(
            "close",
            function() {

                setStatus(
                    "VIDEO CLOSED",
                    "#ff9800"
                );


                remoteVideo.srcObject =
                    null;

            }
        );

    }
);


/* =====================================================
   PEER ERROR
   ===================================================== */

peer.on(
    "error",
    function(error) {

        console.log(
            "PeerJS error:",
            error
        );


        setStatus(
            "PEER ERROR",
            "#ff3333"
        );

    }
);


/* =====================================================
   CONNECT PHONE 1
   ===================================================== */

function connectCamera() {

    const cameraId =
        document.getElementById(
            "cameraId"
        ).value.trim();


    if (!cameraId) {

        alert(
            "Enter Phone 1 Camera Peer ID"
        );

        return;

    }


    if (!myPeerId) {

        alert(
            "Peer ID is not ready yet."
        );

        return;

    }


    dataConnection =
        peer.connect(
            cameraId
        );


    dataConnection.on(
        "open",
        function() {

            setStatus(
                "REQUESTING VIDEO",
                "#ffd740"
            );


            dataConnection.send({

                type:
                    "request-video",

                controllerPeerId:
                    myPeerId

            });

        }
    );


    dataConnection.on(
        "error",
        function(error) {

            console.log(
                "Data connection error:",
                error
            );

        }
    );

}


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
    text,
    color
) {

    const element =
        document.getElementById(
            "status"
        );


    element.textContent =
        text;


    element.style.color =
        color;

}


/* =====================================================
   MANUAL COMMAND
   ===================================================== */

function manualCommand(
    command
) {

    /*
       IMPORTANT:

       Manual movement cancels
       automatic path tracking.
    */

    stopAutoOnly();


    manualActive = true;


    document.getElementById(
        "mode"
    ).textContent =
        "MANUAL";


    document.getElementById(
        "mode"
    ).style.color =
        "#00bfff";


    console.log(
        "MANUAL:",
        command
    );


    fetch(
        command,
        {
            method: "GET",

            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "Manual command error:",
                error
            );

        }
    );

}


/* =====================================================
   MANUAL STOP
   ===================================================== */

function manualStop() {

    manualActive = false;


    fetch(
        "/stop",
        {
            method: "GET",

            cache: "no-store"
        }
    )
    .catch(
        function(error) {

            console.log(
                "STOP error:",
                error
            );

        }
    );


    document.getElementById(
        "mode"
    ).textContent =
        "STOPPED";


    document.getElementById(
        "mode"
    ).style.color =
        "#ff4444";

}


/* =====================================================
   STOP AUTO ONLY
   ===================================================== */

function stopAutoOnly() {

    autoMode = false;


    if (controlTimer) {

        clearInterval(
            controlTimer
        );

        controlTimer = null;

    }


    lastSteer = 0;


    document.getElementById(
        "steerValue"
    ).textContent =
        "0.00";

}


/* =====================================================
   DRAW PATH
   ===================================================== */

function startDrawing() {

    /*
       Stop vehicle first.
    */

    manualStop();


    pathPoints = [];

    drawing = false;

    drawingEnabled = true;


    updatePathCount();


    clearCanvasOnly();


    document.getElementById(
        "mode"
    ).textContent =
        "DRAWING";


    document.getElementById(
        "mode"
    ).style.color =
        "#2196f3";

}


/* =====================================================
   POINTER DOWN
   ===================================================== */

pathCanvas.addEventListener(
    "pointerdown",
    function(event) {

        if (!drawingEnabled) {

            return;

        }


        drawing = true;


        pathCanvas.setPointerCapture(
            event.pointerId
        );


        pathPoints = [];


        addPoint(event);

    }
);


/* =====================================================
   POINTER MOVE
   ===================================================== */

pathCanvas.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing) {

            return;

        }


        addPoint(event);

    }
);


/* =====================================================
   POINTER UP
   ===================================================== */

pathCanvas.addEventListener(
    "pointerup",
    function() {

        drawing = false;

        drawingEnabled = false;


        redraw();


        document.getElementById(
            "mode"
        ).textContent =
            "PATH READY";


        document.getElementById(
            "mode"
        ).style.color =
            "#00ff66";

    }
);


/* =====================================================
   POINTER CANCEL
   ===================================================== */

pathCanvas.addEventListener(
    "pointercancel",
    function() {

        drawing = false;

        drawingEnabled = false;

    }
);


/* =====================================================
   ADD PATH POINT
   ===================================================== */

function addPoint(event) {

    const rect =
        pathCanvas.getBoundingClientRect();


    const x =
        event.clientX -
        rect.left;


    const y =
        event.clientY -
        rect.top;


    if (
        x < 0 ||
        y < 0 ||
        x > rect.width ||
        y > rect.height
    ) {

        return;

    }


    /*
       Avoid too many points.
    */

    if (
        pathPoints.length > 0
    ) {

        const last =
            pathPoints[
                pathPoints.length - 1
            ];


        const dx =
            x - last.x;


        const dy =
            y - last.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance < 4
        ) {

            return;

        }

    }


    pathPoints.push({

        x: x,

        y: y

    });


    redraw();


    updatePathCount();

}


/* =====================================================
   CLEAR PATH
   ===================================================== */

function clearPath() {

    /*
       Stop vehicle.
    */

    manualStop();


    pathPoints = [];

    drawing = false;

    drawingEnabled = false;


    clearCanvasOnly();


    updatePathCount();


    document.getElementById(
        "mode"
    ).textContent =
        "READY";


    document.getElementById(
        "mode"
    ).style.color =
        "#ffd740";

}


/* =====================================================
   CLEAR CANVAS
   ===================================================== */

function clearCanvasOnly() {

    const rect =
        pathCanvas.getBoundingClientRect();


    pathCtx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    drawOverlay();

}


/* =====================================================
   REDRAW PATH
   ===================================================== */

function redraw() {

    const rect =
        pathCanvas.getBoundingClientRect();


    pathCtx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    if (
        pathPoints.length > 0
    ) {

        pathCtx.beginPath();


        pathCtx.moveTo(
            pathPoints[0].x,
            pathPoints[0].y
        );


        for (
            let i = 1;
            i < pathPoints.length;
            i++
        ) {

            pathCtx.lineTo(
                pathPoints[i].x,
                pathPoints[i].y
            );

        }


        pathCtx.lineWidth = 8;

        pathCtx.lineCap =
            "round";

        pathCtx.lineJoin =
            "round";


        pathCtx.strokeStyle =
            "#00ff66";


        pathCtx.stroke();


        /*
           Draw path points.
        */

        for (
            let i = 0;
            i < pathPoints.length;
            i++
        ) {

            pathCtx.beginPath();


            pathCtx.arc(
                pathPoints[i].x,
                pathPoints[i].y,
                3,
                0,
                Math.PI * 2
            );


            pathCtx.fillStyle =
                "#ffffff";


            pathCtx.fill();

        }

    }


    drawOverlay();

}


/* =====================================================
   DRAW CAMERA OVERLAY
   ===================================================== */

function drawOverlay() {

    const rect =
        infoCanvas.getBoundingClientRect();


    infoCtx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    const width =
        rect.width;


    const height =
        rect.height;


    /*
       CAMERA CENTER
    */

    const centerX =
        width / 2;


    infoCtx.beginPath();


    infoCtx.moveTo(
        centerX,
        0
    );


    infoCtx.lineTo(
        centerX,
        height
    );


    infoCtx.strokeStyle =
        "rgba(255,255,255,0.45)";


    infoCtx.lineWidth = 2;


    infoCtx.setLineDash([
        8,
        8
    ]);


    infoCtx.stroke();


    infoCtx.setLineDash([]);


    /*
       LOOK-AHEAD LINE
    */

    const lookY =
        height *
        LOOK_AHEAD_Y;


    infoCtx.beginPath();


    infoCtx.moveTo(
        0,
        lookY
    );


    infoCtx.lineTo(
        width,
        lookY
    );


    infoCtx.strokeStyle =
        "rgba(255,215,64,0.8)";


    infoCtx.lineWidth = 2;


    infoCtx.stroke();


    /*
       LABELS
    */

    infoCtx.font =
        "bold 12px Arial";


    infoCtx.fillStyle =
        "rgba(255,255,255,0.9)";


    infoCtx.fillText(
        "CENTER",
        centerX + 5,
        24
    );


    infoCtx.fillStyle =
        "#ffd740";


    infoCtx.fillText(
        "LOOK AHEAD",
        8,
        lookY - 7
    );


    /*
       AUTO TARGET
    */

    if (
        autoMode &&
        pathPoints.length > 0
    ) {

        const target =
            getLookAheadPoint();


        if (target) {

            infoCtx.beginPath();


            infoCtx.arc(
                target.x,
                target.y,
                12,
                0,
                Math.PI * 2
            );


            infoCtx.strokeStyle =
                "#ff00ff";


            infoCtx.lineWidth = 4;


            infoCtx.stroke();

        }

    }

}


/* =====================================================
   PATH COUNT
   ===================================================== */

function updatePathCount() {

    document.getElementById(
        "pathCount"
    ).textContent =
        pathPoints.length;

}


/* =====================================================
   GET LOOK-AHEAD POINT
   ===================================================== */

function getLookAheadPoint() {

    if (
        pathPoints.length === 0
    ) {

        return null;

    }


    const rect =
        pathCanvas.getBoundingClientRect();


    const targetY =
        rect.height *
        LOOK_AHEAD_Y;


    /*
       Closest point.
    */

    let bestPoint = null;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < pathPoints.length;
        i++
    ) {

        const p =
            pathPoints[i];


        const distance =
            Math.abs(
                p.y -
                targetY
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;


            bestPoint =
                p;

        }

    }


    /*
       Interpolate between
       path points.
    */

    for (
        let i = 0;
        i <
        pathPoints.length - 1;
        i++
    ) {

        const p1 =
            pathPoints[i];


        const p2 =
            pathPoints[i + 1];


        const minY =
            Math.min(
                p1.y,
                p2.y
            );


        const maxY =
            Math.max(
                p1.y,
                p2.y
            );


        if (
            targetY >= minY &&
            targetY <= maxY &&
            p1.y !== p2.y
        ) {

            const ratio =
                (
                    targetY -
                    p1.y
                ) /
                (
                    p2.y -
                    p1.y
                );


            const x =
                p1.x +
                (
                    p2.x -
                    p1.x
                ) *
                ratio;


            return {

                x: x,

                y: targetY

            };

        }

    }


    return bestPoint;

}


/* =====================================================
   CALCULATE STEERING
   ===================================================== */

function calculateSteering() {

    if (
        pathPoints.length < 2
    ) {

        return 0;

    }


    const target =
        getLookAheadPoint();


    if (!target) {

        return 0;

    }


    const rect =
        pathCanvas.getBoundingClientRect();


    const centerX =
        rect.width / 2;


    /*
       -1 = LEFT
        0 = CENTER
       +1 = RIGHT
    */

    let x =
        (
            target.x -
            centerX
        ) /
        centerX;


    /*
       Limit.
    */

    x =
        Math.max(
            -MAX_STEER,
            Math.min(
                MAX_STEER,
                x
            )
        );


    /*
       Dead band.
    */

    if (
        Math.abs(x) <
        DEAD_BAND
    ) {

        x = 0;

    }


    /*
       Smoothing.
    */

    const smooth =
        (
            lastSteer *
            0.70
        )
        +
        (
            x *
            0.30
        );


    lastSteer =
        smooth;


    return smooth;

}


/* =====================================================
   START AUTO
   ===================================================== */

function startAuto() {

    if (
        pathPoints.length < 2
    ) {

        alert(
            "First draw a path."
        );

        return;

    }


    /*
       Stop manual mode.
    */

    manualActive = false;


    drawingEnabled = false;


    autoMode = true;


    lastSteer = 0;


    document.getElementById(
        "mode"
    ).textContent =
        "AUTO TRACKING";


    document.getElementById(
        "mode"
    ).style.color =
        "#00ff66";


    /*
       Existing timer.
    */

    if (controlTimer) {

        clearInterval(
            controlTimer
        );

    }


    controlTimer =
        setInterval(
            updateSteering,
            100
        );


    updateSteering();

}


/* =====================================================
   UPDATE AUTO STEERING
   ===================================================== */

function updateSteering() {

    if (!autoMode) {

        return;

    }


    const x =
        calculateSteering();


    document.getElementById(
        "steerValue"
    ).textContent =
        x.toFixed(2);


    sendSteering(x);


    drawOverlay();

}


/* =====================================================
   SEND AUTO STEERING
   ===================================================== */

function sendSteering(x) {

    fetch(
        "/steer?x=" +
        encodeURIComponent(
            x.toFixed(3)
        ),
        {

            method: "GET",

            cache: "no-store"

        }
    )
    .then(
        function(response) {

            if (!response.ok) {

                console.log(
                    "ESP32 steering error"
                );

            }

        }
    )
    .catch(
        function(error) {

            console.log(
                "ESP32 steering:",
                error
            );

        }
    );

}


/* =====================================================
   STOP AUTO
   ===================================================== */

function stopAuto() {

    stopAutoOnly();


    fetch(
        "/stop",
        {

            method: "GET",

            cache: "no-store"

        }
    )
    .catch(
        function(error) {

            console.log(
                "STOP error:",
                error
            );

        }
    );


    document.getElementById(
        "mode"
    ).textContent =
        "STOPPED";


    document.getElementById(
        "mode"
    ).style.color =
        "#ff4444";


    drawOverlay();

}


/* =====================================================
   PAGE EXIT SAFETY
   ===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        try {

            navigator.sendBeacon(
                "/stop"
            );

        }
        catch (e) {}

    }
);


/* =====================================================
   INITIALIZATION
   ===================================================== */

setTimeout(
    function() {

        resizeCanvas();

        drawOverlay();

    },
    500
);

</script>
